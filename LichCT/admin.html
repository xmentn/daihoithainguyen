<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Quản trị cán bộ</title>
    <link rel="stylesheet" href="./css/style.css" />
  </head>
  <body>
    <header class="banner-header">
      <img
        src="./images/banner_lich_cong_tac.png"
        alt="Lịch công tác Phòng Chuyển đổi số - Cơ yếu"
        class="banner-image"
      />
    </header>

    <nav class="main-nav">
      <div class="main-nav-inner">
        <a href="./index.html">Lịch chung</a>
        <a href="./lichcanhan.html">Lịch cá nhân</a>
        <a class="active" href="./admin.html">Quản trị cán bộ</a>
      </div>
    </nav>

    <main class="container admin-container">
      <section class="statistics admin-stats">
        <div class="stat-card">
          <div class="stat-title">Tổng số cán bộ</div>
          <div class="stat-number" id="staffCount">0</div>
        </div>
        <div class="stat-card">
          <div class="stat-title">Đang hoạt động</div>
          <div class="stat-number" id="activeStaffCount">0</div>
        </div>
      </section>

      <div class="admin-layout">
        <section class="panel">
          <div class="panel-header">
            <div>
              <div class="small-title">THÔNG TIN CÁN BỘ</div>
              <h2 id="staffFormTitle">Thêm cán bộ</h2>
            </div>
          </div>

          <form id="staffForm">
            <input type="hidden" id="staffId" />

            <div class="form-grid admin-form-grid">
              <div class="form-group form-full">
                <label for="hoTen"
                  >Họ và tên <span class="required">*</span></label
                >
                <input
                  type="text"
                  id="hoTen"
                  placeholder="Nhập họ và tên"
                  required
                />
              </div>

              <div class="form-group">
                <label for="chucVu">Chức vụ</label>
                <input
                  type="text"
                  id="chucVu"
                  placeholder="Ví dụ: Chuyên viên"
                />
              </div>

              <div class="form-group">
                <label for="thuTu">Thứ tự hiển thị</label>
                <input type="number" id="thuTu" value="1" min="1" />
              </div>

              <div class="form-group form-full">
                <label for="email">Email</label>
                <input
                  type="email"
                  id="email"
                  placeholder="Ví dụ: abc@thainguyen.dcs.vn"
                />
              </div>

              <div class="form-group form-full">
                <label class="checkbox-label">
                  <input type="checkbox" id="hoatDong" checked />
                  Đang hoạt động
                </label>
              </div>
            </div>

            <div class="form-buttons">
              <button
                type="submit"
                class="button button-primary"
                id="saveStaffButton"
              >
                Lưu cán bộ
              </button>
              <button
                type="button"
                class="button button-secondary hidden"
                id="cancelStaffEditButton"
              >
                Hủy chỉnh sửa
              </button>
            </div>
          </form>

          <div class="message hidden" id="message"></div>
        </section>

        <section class="panel">
          <div class="panel-header schedule-list-header">
            <div>
              <div class="small-title">DANH SÁCH</div>
              <h2>Cán bộ trong phòng</h2>
            </div>
            <input
              class="admin-search"
              type="search"
              id="staffSearchInput"
              placeholder="Tìm theo họ tên, chức vụ"
            />
          </div>

          <div id="staffLoading" class="loading">Đang tải danh sách...</div>

          <div class="table-container">
            <table class="staff-table">
              <thead>
                <tr>
                  <th>STT</th>
                  <th>Họ và tên</th>
                  <th>Chức vụ</th>
                  <th>Email</th>
                  <th>Trạng thái</th>
                  <th>Thao tác</th>
                </tr>
              </thead>
              <tbody id="staffTableBody"></tbody>
            </table>
          </div>

          <div id="staffEmptyState" class="empty-state hidden">
            Chưa có cán bộ.
          </div>
        </section>
      </div>
    </main>

    <footer class="footer">
      Phòng Chuyển đổi số - Cơ yếu, Văn phòng Tỉnh ủy
    </footer>
    <script type="module" src="./js/admin.js"></script>
  </body>
</html>
