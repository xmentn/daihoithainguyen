<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đăng nhập quản trị</title>
    <link rel="stylesheet" href="./css/style.css">
    <link rel="stylesheet" href="./css/login.css">
</head>
<body class="login-page">
    <main class="login-wrapper">
        <section class="login-card">
            <div class="login-brand">
                <div class="logo-symbol">★</div>
                <div>
                    <div class="agency-name">VĂN PHÒNG TỈNH ỦY</div>
                    <h1>ĐĂNG NHẬP QUẢN TRỊ</h1>
                    <p>Phòng Chuyển đổi số - Cơ yếu</p>
                </div>
            </div>

            <form id="loginForm" class="login-form">
                <div class="form-group">
                    <label for="email">Địa chỉ email</label>
                    <input
                        type="email"
                        id="email"
                        autocomplete="username"
                        placeholder="Nhập email quản trị"
                        required
                    >
                </div>

                <div class="form-group">
                    <label for="password">Mật khẩu</label>
                    <div class="password-wrap">
                        <input
                            type="password"
                            id="password"
                            autocomplete="current-password"
                            placeholder="Nhập mật khẩu"
                            required
                        >
                        <button id="togglePassword" type="button" class="toggle-password">
                            Hiện
                        </button>
                    </div>
                </div>

                <button id="loginButton" class="button button-primary login-button" type="submit">
                    Đăng nhập
                </button>
            </form>

            <div id="loginMessage" class="message hidden"></div>

            <a class="back-link" href="./index.html">← Trở về lịch công tác</a>
        </section>
    </main>

    <script type="module" src="./js/login.js"></script>
</body>
</html>
