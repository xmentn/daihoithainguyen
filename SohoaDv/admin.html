<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Trang quản trị - Số hóa Đảng viên Thái Nguyên</title>

    <!-- CSS Thư viện -->
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-weight/6.4.0/css/all.min.css"
    />
    <!-- CSS Tự định nghĩa (Sử dụng chung style của hệ thống) -->
    <link rel="stylesheet" href="css/style.css" />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/sweetalert2@11/dist/sweetalert2.min.css"
    />
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <style>
      /* CSS bổ sung dành riêng cho trang Admin */
      .login-container {
        max-width: 400px;
        margin: 100px auto;
        background: #fff;
        padding: 30px;
        border-radius: 8px;
        box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
      }
      .form-group {
        margin-bottom: 15px;
        display: flex;
        flex-direction: column;
        gap: 5px;
      }
      .form-group input,
      .form-group select {
        padding: 10px;
        border: 1px solid #ccc;
        border-radius: 4px;
        font-size: 15px;
      }
      .btn {
        padding: 10px 20px;
        border: none;
        border-radius: 4px;
        font-weight: bold;
        cursor: pointer;
        display: inline-flex;
        align-items: center;
        gap: 8px;
        text-decoration: none;
      }
      .btn-primary {
        background-color: #0056b3;
        color: white;
      }
      .btn-danger {
        background-color: #e74c3c;
        color: white;
      }
      .btn-secondary {
        background-color: #95a5a6;
        color: white;
      }

      .admin-panel {
        display: none;
      } /* Ẩn đi khi chưa đăng nhập */

      .data-table {
        width: 100%;
        border-collapse: collapse;
        margin-top: 20px;
        background: #fff;
      }
      .data-table th,
      .data-table td {
        border: 1px solid #ddd;
        padding: 12px;
        text-align: left;
      }
      .data-table th {
        background-color: #f8f9fa;
      }
      .header-admin {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 20px;
        flex-wrap: wrap;
        gap: 15px;
      }
    </style>
  </head>
  <body>
    <!-- DÙNG CHUNG BANNER VỚI TRANG CHỦ -->
    <header class="banner-container">
      <img src="images/banner.png" alt="Banner Hệ Thống" />
    </header>

    <!-- Khối đăng nhập bảo mật -->
    <div id="login-section" class="login-container">
      <h3 style="text-align: center; margin-bottom: 20px; color: #0056b3">
        <i class="fa-solid fa-lock"></i> ĐĂNG NHẬP ADMIN
      </h3>
      <div class="form-group">
        <label>Email quản trị:</label>
        <input
          type="email"
          id="admin-email"
          placeholder="Nhập email admin..."
        />
      </div>
      <div class="form-group">
        <label>Mật khẩu:</label>
        <input
          type="password"
          id="admin-password"
          placeholder="Nhập mật khẩu..."
        />
      </div>
      <button
        id="btn-login"
        class="btn btn-primary"
        style="width: 100%; justify-content: center; margin-top: 10px"
      >
        Đăng nhập <i class="fa-solid fa-right-to-bracket"></i>
      </button>
    </div>

    <!-- Khối quản lý dữ liệu (Chỉ hiện sau khi đăng nhập thành công) -->
    <main id="admin-section" class="container admin-panel">
      <div class="header-admin">
        <div>
          <h2>Hệ thống quản trị số liệu</h2>
          <!-- KHU VỰC HIỂN THỊ PHIÊN ĐĂNG NHẬP -->
          <span
            id="admin-user-info"
            style="
              font-size: 14px;
              color: #555;
              display: block;
              margin-top: 5px;
            "
          >
            <i class="fa-solid fa-circle-user"></i> Đang kết nối...
          </span>
        </div>
        <div style="display: flex; gap: 10px; align-items: center">
          <a href="index.html" class="btn btn-secondary">
            <i class="fa-solid fa-house"></i> Quay lại Trang chủ
          </a>
          <button id="btn-logout" class="btn btn-danger">
            Đăng xuất <i class="fa-solid fa-right-from-bracket"></i>
          </button>
        </div>
      </div>

      <!-- Form Cập nhật tiến độ -->
      <section class="control-panel">
        <h3>Cập nhật tiến độ cho Đảng bộ</h3>
        <hr style="margin: 15px 0; border: 0; border-top: 1px solid #eee" />

        <form
          id="progress-form"
          style="
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 15px;
          "
        >
          <div class="form-group" style="grid-column: span 2">
            <label for="admin-select-dangbo">Chọn Đảng bộ:</label>
            <select id="admin-select-dangbo" required>
              <option value="">-- Chọn một Đảng bộ trực thuộc --</option>
              <!-- 94 Đảng bộ tự động nạp từ Firebase -->
            </select>
          </div>
          <div class="form-group">
            <label>Số hồ sơ cần số hóa:</label>
            <input
              type="number"
              id="input-can-so-hoa"
              min="0"
              required
              value="0"
            />
          </div>
          <div class="form-group">
            <label>Số đã chỉnh lý, chuẩn hóa:</label>
            <input
              type="number"
              id="input-chinh-ly"
              min="0"
              required
              value="0"
            />
          </div>
          <div class="form-group">
            <label>Số hồ sơ đã ký số:</label>
            <input type="number" id="input-ky-so" min="0" required value="0" />
          </div>
          <div class="form-group">
            <label>Số đã đưa lên phần mềm:</label>
            <input
              type="number"
              id="input-phan-mem"
              min="0"
              required
              value="0"
            />
          </div>

          <div
            style="
              grid-column: span 2;
              display: flex;
              gap: 10px;
              margin-top: 15px;
            "
          >
            <button type="submit" class="btn btn-primary">
              <i class="fa-solid fa-floppy-disk"></i> Lưu dữ liệu
            </button>
            <button type="button" id="btn-reset-form" class="btn btn-secondary">
              Làm lại
            </button>
          </div>
        </form>
      </section>

      <!-- Danh sách hiển thị để đối soát và xóa -->
      <section class="control-panel" style="margin-top: 30px">
        <h3>Danh sách tiến độ đã nhập</h3>
        <div style="overflow-x: auto">
          <table class="data-table">
            <thead>
              <tr>
                <th>Tên Đảng bộ</th>
                <th>Cần số hóa</th>
                <th>Đã chỉnh lý</th>
                <th>Đã ký số</th>
                <th>Đưa lên phần mềm</th>
                <th style="width: 120px; text-align: center">Hành động</th>
              </tr>
            </thead>
            <tbody id="table-data-body">
              <!-- Dữ liệu tiến độ tải từ Firebase sẽ render tại đây -->
            </tbody>
          </table>
        </div>
      </section>
    </main>

    <!-- Nhúng Firebase v9 (compat) -->
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>

    <!-- Script nghiệp vụ -->
    <script src="js/firebase-config.js"></script>
    <script src="js/admin.js"></script>
  </body>
</html>
