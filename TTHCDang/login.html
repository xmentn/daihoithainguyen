<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Đăng nhập - Hệ thống Quản lý TTHC Đảng</title>
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
    />
    <link rel="stylesheet" href="style.css" />
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <style>
      body {
        display: flex;
        justify-content: center;
        align-items: center;
        background-color: #f4f6f9;
        height: 100vh;
        margin: 0;
      }
      .login-card {
        background: #fff;
        padding: 35px 30px;
        border-radius: 8px;
        box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
        width: 100%;
        max-width: 400px;
        border-top: 5px solid #003366;
      }
      .login-card h2 {
        text-align: center;
        color: #003366;
        font-size: 1.3rem;
        margin-bottom: 25px;
        font-weight: bold;
        line-height: 1.4;
      }
      .form-group {
        margin-bottom: 20px;
      }
      .form-group label {
        display: block;
        margin-bottom: 8px;
        font-weight: bold;
        color: #333;
        font-size: 0.9rem;
      }
      input[type="email"],
      input[type="password"] {
        width: 100%;
        padding: 10px 12px;
        border: 1px solid #ced4da;
        border-radius: 4px;
        font-size: 0.9rem;
        box-sizing: border-box;
      }
      input:focus {
        outline: none;
        border-color: #003366;
        box-shadow: 0 0 0 3px rgba(0, 51, 102, 0.15);
      }
      #toggle-password:hover {
        color: #003366 !important;
      }
    </style>
  </head>
  <body>
    <div class="login-card">
      <h2>
        HỆ THỐNG QUẢN LÝ TTHC ĐẢNG<br />
        <span style="font-size: 0.95rem; font-weight: normal; color: #666"
          >Đăng nhập hệ thống</span
        >
      </h2>

      <form id="form-login">
        <div class="form-group">
          <label for="login-email">Tài khoản (Email):</label>
          <input
            type="email"
            id="login-email"
            required
            placeholder="example@cdsthainguyen.vn"
          />
        </div>

        <div class="form-group">
          <label for="password">Mật khẩu:</label>
          <div style="position: relative; display: flex; align-items: center">
            <input
              type="password"
              id="password"
              required
              style="padding-right: 40px"
              placeholder="Nhập mật khẩu của bạn..."
            />
            <i
              class="fa-solid fa-eye"
              id="toggle-password"
              style="
                position: absolute;
                right: 12px;
                cursor: pointer;
                color: #64748b;
                font-size: 0.95rem;
                transition: color 0.2s;
              "
            ></i>
          </div>
        </div>

        <button
          type="submit"
          class="btn-submit"
          style="margin-top: 10px; width: 100%; justify-content: center"
        >
          <i class="fa-solid fa-right-to-bracket"></i> ĐĂNG NHẬP
        </button>
      </form>
    </div>

    <script type="module" src="login.js"></script>
  </body>
</html>
