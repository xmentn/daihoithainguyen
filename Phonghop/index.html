<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
     <link rel="icon" type="image/png" href="../images/Codang.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sơ Đồ Phòng Họp</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="room-container">
      <h1 class="room-title">SƠ ĐỒ CHỖ NGỒI HỘI TRƯỜNG TẦNG 5, NHÀ C</h1>

      <div class="u-shape-layout">
        <div id="top-row" class="row-container top-row"></div>

        <div class="side-container">
          <div id="left-col" class="column-container left-col"></div>

          <div class="middle-space">
            <div class="search-inside-u">
              <label for="delegateSearch">Tìm vị trí đại biểu:</label>
              <input
                list="delegateList"
                id="delegateSearch"
                placeholder="Gõ tên hoặc bấm ⬇️ để chọn..."
                onchange="selectDelegateFromDropdown()"
              />
              <datalist id="delegateList"> </datalist>
            </div>

            <div class="carpet"></div>
          </div>

          <div id="right-col" class="column-container right-col"></div>
        </div>
      </div>
    </div>

    <script src="script.js"></script>
  </body>
</html>
