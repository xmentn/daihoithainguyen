<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <title>Quản trị Hệ thống</title>
    <link rel="stylesheet" href="admin.css" />
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  </head>
  <body>
    <div class="admin-container">
      <h1>QUẢN TRỊ HỆ THỐNG</h1>
      <div class="nav-links"><a href="index.html">🔙 Quay lại Sơ đồ</a></div>

      <div class="tabs">
        <button class="tab-btn active" data-tab="tab-danhsach">
          Danh sách Đại biểu
        </button>
        <button class="tab-btn" data-tab="tab-vitri">Vị trí Chỗ ngồi</button>
      </div>

      <div id="tab-danhsach" class="tab-content active">
        <div class="form-section">
          <h3 id="form-title">Thêm Đại biểu mới</h3>
          <form id="delegate-form">
            <input type="hidden" id="delegate-id" />
            <div class="form-group" style="display: flex; gap: 10px">
              <input
                type="number"
                id="delegate-rank"
                required
                placeholder="Rank (VD: 1, 2...)"
                style="width: 120px"
                min="1"
              />
              <input
                type="text"
                id="fullname"
                required
                placeholder="Nhập Họ và Tên (VD: Nguyễn Minh Đức)"
                style="flex: 1"
              />
            </div>
            <button type="submit" id="save-btn" class="btn-primary">
              Lưu Đại biểu
            </button>
            <button
              type="button"
              id="cancel-btn"
              style="display: none"
              class="btn-secondary"
            >
              Hủy
            </button>
          </form>
        </div>
        <table>
          <thead>
            <tr>
              <th>STT</th>
              <th>Rank</th>
              <th>Họ và Tên</th>
              <th>Thao tác</th>
            </tr>
          </thead>
          <tbody id="table-danhsach"></tbody>
        </table>
      </div>

      <div id="tab-vitri" class="tab-content">
        <div
          style="
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
          "
        >
          <p style="color: #555; margin: 0">
            <i>* Nhập mã ghế (V1, A1...) để xếp chỗ. Bỏ trống nếu không dự.</i>
          </p>
          <button
            id="clear-all-seats"
            style="
              background: #e74c3c;
              color: white;
              border: none;
              padding: 8px 15px;
              border-radius: 4px;
              font-weight: bold;
              cursor: pointer;
            "
          >
            🗑️ Xóa toàn bộ ghế
          </button>
        </div>
        <table>
          <thead>
            <tr>
              <th>STT</th>
              <th>Rank</th>
              <th>Họ và Tên</th>
              <th>Mã ghế hiện tại</th>
              <th>Thao tác</th>
            </tr>
          </thead>
          <tbody id="table-vitri"></tbody>
        </table>
      </div>
    </div>
    <script type="module" src="admin.js"></script>
  </body>
</html>
