<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <title>Quản trị Danh sách Đại biểu</title>
    <link rel="stylesheet" href="admin.css">
</head>

<body>
    <div class="admin-container">
        <h1>QUẢN TRỊ DANH SÁCH ĐẠI BIỂU</h1>
        <div class="nav-links">
            <a href="index.html" target="_blank">👉 Xem Sơ đồ Hội trường</a>
        </div>

        <div class="form-section">
            <h2 id="form-title">Thêm Đại biểu mới</h2>
            <form id="delegate-form">
                <input type="hidden" id="delegate-id">

                <div class="form-group">
                    <label>Họ và Tên:</label>
                    <input type="text" id="fullname" required placeholder="VD: Nguyễn Văn A">
                </div>

                <div class="form-group">
                    <label>Vị trí ghế (V1-V5 hoặc A1, B2...):</label>
                    <input type="text" id="seat-code" required placeholder="VD: V1 hoặc A3">
                </div>

                <div class="form-actions">
                    <button type="submit" id="save-btn">Lưu thông tin</button>
                    <button type="button" id="cancel-btn" style="display:none; background:#95a5a6;">Hủy sửa</button>
                </div>
            </form>
        </div>

        <div class="table-section">
            <h2>Danh sách đã xếp chỗ</h2>
            <table id="delegate-table">
                <thead>
                    <tr>
                        <th>STT</th>
                        <th>Họ và Tên</th>
                        <th>Vị trí ghế</th>
                        <th>Thao tác</th>
                    </tr>
                </thead>
                <tbody id="table-body">
                    <!-- Dữ liệu sẽ đổ vào đây -->
                </tbody>
            </table>
        </div>
    </div>
    <script src="admin.js"></script>
</body>

</html>
