<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <title>Cập nhật số liệu - Quản trị</title>
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body>
    <script type="module">
      import { checkAdminAccess } from "./js/auth.js";
      checkAdminAccess(); // Bảo vệ trang chặn user thường truy cập
    </script>

    <header>
      <h1>HỆ THỐNG QUẢN TRỊ SỐ LIỆU</h1>
      <button onclick="logoutUser()" class="btn-logout">Đăng xuất</button>
    </header>

    <main class="admin-container">
      <form id="updateForm">
        <h3>1. Số liệu Chỉnh lý Tài liệu (mét) [cite: 2]</h3>
        <div class="form-row">
          <label>Đã chỉnh lý xong:</label>
          <input
            type="number"
            step="0.1"
            id="input-cl-xong"
            value="87"
            required
          />
        </div>
        <div class="form-row">
          <label>Còn lại (sơ bộ):</label>
          <input
            type="number"
            step="0.1"
            id="input-cl-conlai"
            value="76"
            required
          />
        </div>

        <h3>2. Số liệu Số hóa Tài liệu (trang) [cite: 3]</h3>
        <div class="form-row">
          <label>Đã scan xong:</label>
          <input type="number" id="input-sh-scan" value="430000" required />
        </div>
        <div class="form-row">
          <label>Biên mục và Chuẩn hóa:</label>
          <input type="number" id="input-sh-chuanhoa" value="320000" required />
        </div>

        <button type="submit" id="btnUpdate" class="btn-save">
          Cập nhật Dashboard
        </button>
      </form>
    </main>

    <script type="module" src="js/admin.js"></script>
    <script type="module" src="js/auth.js"></script>
  </body>
</html>
