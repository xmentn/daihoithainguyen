<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <title>Cập nhật số liệu - Quản trị</title>
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body>
    <script type="module">
      import { checkAdminAccess } from "./js/auth.js";
      checkAdminAccess(); // Bảo vệ trang chặn user thường truy cập
    </script>

    <header>
      <h1>HỆ THỐNG QUẢN TRỊ SỐ LIỆU</h1>
      <button onclick="logoutUser()" class="btn-logout">Đăng xuất</button>
    </header>

    <main class="admin-container">
      <form id="updateForm" onsubmit="updateData(event)">
        <h3>1. Số liệu Chỉnh lý Tài liệu (mét)</h3>
        <div class="form-row">
          <label>Đã chỉnh lý xong:</label>
          <input type="number" step="0.1" id="input-cl-xong" required />
        </div>
        <div class="form-row">
          <label>Còn lại (sơ bộ):</label>
          <input type="number" step="0.1" id="input-cl-conlai" required />
        </div>

        <h3>2. Số liệu Số hóa Tài liệu (trang)</h3>
        <div class="form-row">
          <label>Đã scan xong:</label>
          <input type="number" id="input-sh-scan" required />
        </div>
        <div class="form-row">
          <label>Tổng số trang cần scan (Chỉ tiêu):</label>
          <input
            type="number"
            id="input-tong-scan"
            placeholder="Ví dụ: 500000"
            required
          />
        </div>
        <div class="form-row">
          <label>Đã biên mục và Chuẩn hóa:</label>
          <input type="number" id="input-sh-chuanhoa" required />
        </div>
        <div class="form-row">
          <label>Tổng số trang cần chuẩn hóa (Chỉ tiêu):</label>
          <input
            type="number"
            id="input-tong-chuanhoa"
            placeholder="Ví dụ: 500000"
            required
          />
        </div>

        <button type="submit" class="btn-save">Cập nhật Dashboard</button>
      </form>
    </main>

    <script type="module" src="js/admin.js"></script>
    <script type="module" src="js/auth.js"></script>
  </body>
</html>
