<!doctype html>
<html lang="vi">

<head>
  <meta charset="UTF-8" />
  <title>Đăng nhập Hệ thống - Quản trị</title>
  <link rel="stylesheet" href="css/style.css" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
</head>

<body>
  <div class="login-box">
    <h2>ĐĂNG NHẬP HỆ THỐNG</h2>
    <div id="error-message"
      style="display: none; background: #fff5f5; color: #e53e3e; border: 1px solid #fed7d7; padding: 10px 14px; border-radius: 8px; font-size: 13.5px; margin-bottom: 18px; text-align: left; font-weight: 500;">
      <i class="fa-solid fa-circle-exclamation" style="margin-right: 6px;"></i> <span id="error-text"></span>
    </div>

    <form id="loginForm" onsubmit="loginUser(event)">

      <div class="input-group">
        <label>Email công vụ</label>
        <input type="email" id="email" required placeholder="User@thainguyen.gov.vn" />
      </div>

      <div class="input-group">
        <label>Mật khẩu</label>
        <input type="password" id="password" required />
      </div>

      <button type="submit" class="btn-submit btn-login">Đăng nhập</button>
    </form>

    <p><a href="index.html">← Quay lại Dashboard</a></p>
  </div>

  <script type="module" src="js/auth.js"></script>
</body>

</html>
