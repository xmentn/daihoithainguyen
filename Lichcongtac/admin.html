<!DOCTYPE html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Quản Trị - Lịch Công Tác</title>
    <link
      href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700&display=swap"
      rel="stylesheet"
    />

    <style>
      /* --- CSS CHUNG --- */
      body {
        font-family: "Roboto", sans-serif;
        background: #f0f2f5;
        margin: 0;
        padding: 20px;
      }
      .container {
        max-width: 900px;
        margin: 0 auto;
        background: white;
        padding: 40px;
        border-radius: 12px;
        box-shadow: 0 5px 20px rgba(0, 0, 0, 0.08);
      }
      h2,
      h3 {
        text-align: center;
        color: #2c3e50;
        margin-bottom: 20px;
      }

      .controls {
        display: flex;
        gap: 20px;
        justify-content: center;
        margin-bottom: 10px;
      }
      .row-2 {
        display: flex;
        gap: 20px;
      }
      .row-2 > div {
        flex: 1;
      }
      .form-group {
        margin-bottom: 15px;
      }

      label {
        font-weight: 500;
        display: block;
        margin-bottom: 6px;
        color: #34495e;
      }
      select,
      input,
      textarea {
        width: 100%;
        padding: 10px;
        border: 1px solid #ced4da;
        border-radius: 6px;
        font-size: 15px;
        box-sizing: border-box;
      }

      /* Button Styles */
      button {
        cursor: pointer;
        border: none;
        border-radius: 6px;
        font-weight: bold;
        transition: 0.3s;
      }

      #btn-save {
        width: 100%;
        padding: 14px;
        background: #28a745;
        color: white;
        font-size: 16px;
        margin-top: 10px;
      }
      #btn-save:hover {
        background: #218838;
      }
      #btn-save.editing {
        background: #ffc107;
        color: #000;
      } /* Màu vàng khi đang sửa */

      #btn-cancel {
        width: 100%;
        padding: 14px;
        background: #6c757d;
        color: white;
        font-size: 16px;
        margin-top: 10px;
        display: none;
      }

      /* Table List Styles */
      .list-section {
        margin-top: 40px;
        border-top: 2px solid #eee;
        padding-top: 20px;
      }
      table {
        width: 100%;
        border-collapse: collapse;
        font-size: 14px;
        margin-top: 15px;
      }
      th,
      td {
        border: 1px solid #ddd;
        padding: 10px;
        text-align: left;
      }
      th {
        background: #f8f9fa;
        font-weight: bold;
      }

      .btn-action {
        padding: 5px 10px;
        font-size: 12px;
        margin-right: 5px;
        color: white;
      }
      .btn-edit {
        background: #ffc107;
        color: black;
      }
      .btn-delete {
        background: #dc3545;
      }

      /* Loading Overlay */
      .loading-overlay {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background: rgba(255, 255, 255, 0.8);
        display: none;
        justify-content: center;
        align-items: center;
        z-index: 999;
        font-size: 20px;
        font-weight: bold;
        color: #555;
      }
    </style>
  </head>
  <body>
    <div class="loading-overlay" id="loadingOverlay">Đang xử lý...</div>

    <div class="container">
      <h2>QUẢN TRỊ LỊCH CÔNG TÁC</h2>

      <div class="controls">
        <div style="width: 120px">
          <label>Năm:</label>
          <select id="select-year"></select>
        </div>
        <div style="width: 120px">
          <label>Tuần:</label>
          <select id="select-week"></select>
        </div>
      </div>

      <div
        id="week-range"
        style="text-align: center; font-style: italic; margin-bottom: 20px"
      >
        ...
      </div>

      <form id="schedule-form">
        <input type="hidden" id="input-rowIndex" value="" />
        <input type="hidden" id="input-action" value="add" />

        <div class="row-2">
          <div class="form-group">
            <label>Ngày:</label>
            <select id="input-date" required></select>
          </div>
          <div class="form-group">
            <label>Buổi:</label>
            <select id="input-session">
              <option value="Sáng">Sáng</option>
              <option value="Chiều">Chiều</option>
              <option value="Tối">Tối</option>
            </select>
          </div>
        </div>

        <div class="row-2">
          <div class="form-group">
            <label>Giờ:</label>
            <input type="text" id="input-time" placeholder="08h30" />
          </div>
          <div class="form-group">
            <label>Đơn vị mời:</label>
            <input type="text" id="input-host" />
          </div>
        </div>

        <div class="form-group">
          <label>Nội dung:</label>
          <textarea id="input-content" rows="3" required></textarea>
        </div>

        <div class="form-group">
          <label>Địa điểm:</label>
          <input type="text" id="input-location" />
        </div>

        <div class="row-2">
          <div class="form-group">
            <label>Thành phần:</label>
            <input
              type="text"
              id="input-participants"
              value="Thường trực Tỉnh ủy"
            />
          </div>
          <div class="form-group">
            <label>Lãnh đạo:</label>
            <input type="text" id="input-leader" />
          </div>
        </div>

        <div class="row-2">
          <button type="submit" id="btn-save">THÊM MỚI</button>
          <button type="button" id="btn-cancel" onclick="resetForm()">
            HỦY SỬA
          </button>
        </div>
      </form>

      <div class="list-section">
        <h3>DANH SÁCH LỊCH TUẦN NÀY</h3>
        <table>
          <thead>
            <tr>
              <th style="width: 15%">Ngày/Giờ</th>
              <th style="width: 45%">Nội dung</th>
              <th style="width: 25%">Địa điểm</th>
              <th style="width: 15%">Thao tác</th>
            </tr>
          </thead>
          <tbody id="admin-table-body"></tbody>
        </table>
      </div>
    </div>

    <script>
      // ============================================================
      // ⚠️ DÁN WEB APP URL CỦA BẠN VÀO ĐÂY
      // ============================================================
      const SCRIPT_URL =
        "https://script.google.com/macros/s/AKfycbzbRrO1huCYRA1It2sz7LpqQYmONl0pBenrTjHqY0kLN-Sikhs59jQx1JSaTIf73L-I/exec";

      let fullData = []; // Biến lưu toàn bộ dữ liệu tải về

      // Khởi tạo
      document.addEventListener("DOMContentLoaded", () => {
        initControls();
      });

      // 1. Setup Dropdown & Load Data
      function initControls() {
        const yearSelect = document.getElementById("select-year");
        const weekSelect = document.getElementById("select-week");

        const today = new Date();
        let currentYear = today.getFullYear();
        let currentWeek = getWeekNumber(today);
        if (today.getMonth() === 11 && currentWeek === 1) currentYear += 1;

        // Tạo option Năm
        for (let y = currentYear - 1; y <= currentYear + 1; y++) {
          const opt = document.createElement("option");
          opt.value = y;
          opt.textContent = y;
          yearSelect.appendChild(opt);
        }
        yearSelect.value = currentYear;

        // Tạo option Tuần
        for (let w = 1; w <= 53; w++) {
          const opt = document.createElement("option");
          opt.value = w;
          opt.textContent = `Tuần ${w}`;
          weekSelect.appendChild(opt);
        }
        weekSelect.value = currentWeek;

        updateDateRange(); // Tính ngày
        fetchData(); // Tải dữ liệu về bảng

        // Sự kiện thay đổi
        yearSelect.addEventListener("change", () => {
          updateDateRange();
          renderAdminTable();
        });
        weekSelect.addEventListener("change", () => {
          updateDateRange();
          renderAdminTable();
        });
      }

      // 2. Tải dữ liệu từ Google Sheet (Để hiển thị list bên dưới)
      function fetchData() {
        showLoading(true);
        fetch(SCRIPT_URL)
          .then((res) => res.json())
          .then((data) => {
            fullData = data;
            renderAdminTable();
            showLoading(false);
          })
          .catch((err) => {
            alert("Lỗi tải dữ liệu: " + err);
            showLoading(false);
          });
      }

      // 3. Hiển thị dữ liệu ra bảng Admin
      function renderAdminTable() {
        const selectedYear = document.getElementById("select-year").value;
        const selectedWeek = document.getElementById("select-week").value;
        const tbody = document.getElementById("admin-table-body");

        tbody.innerHTML = "";

        // Lọc dữ liệu theo tuần/năm đang chọn
        const weekData = fullData.filter(
          (row) => row.Nam == selectedYear && row.Tuan == selectedWeek
        );

        if (weekData.length === 0) {
          tbody.innerHTML =
            '<tr><td colspan="4" style="text-align:center;">Chưa có dữ liệu nào.</td></tr>';
          return;
        }

        // Sắp xếp theo ngày
        weekData.sort((a, b) => {
          // Logic sắp xếp đơn giản theo chuỗi ngày (cần cải thiện nếu muốn chuẩn xác tuyệt đối)
          return a.Ngay.localeCompare(b.Ngay);
        });

        weekData.forEach((row) => {
          const tr = document.createElement("tr");
          // Lưu ý: row.rowIndex là ID dòng do Backend trả về
          tr.innerHTML = `
                <td><b>${row.Thu}</b><br>${row.Ngay.replace(
            /'/g,
            ""
          )}<br><small>${row.Gio || ""}</small></td>
                <td>${row.NoiDung}</td>
                <td>${row.DiaDiem}</td>
                <td>
                    <button class="btn-action btn-edit" onclick='editRow(${JSON.stringify(
                      row
                    )})'>✏️ Sửa</button>
                    <button class="btn-action btn-delete" onclick="deleteRow(${
                      row.rowIndex
                    })">🗑️ Xóa</button>
                </td>
            `;
          tbody.appendChild(tr);
        });
      }

      // 4. CHỨC NĂNG SỬA: Đưa dữ liệu lên Form
      window.editRow = function (row) {
        // Cuộn lên đầu trang
        window.scrollTo({ top: 0, behavior: "smooth" });

        // Điền dữ liệu vào form
        document.getElementById("input-rowIndex").value = row.rowIndex;
        document.getElementById("input-action").value = "edit";

        // Chọn lại ngày trong dropdown (phức tạp vì dropdown chứa JSON)
        // Ta duyệt qua các option để tìm option chứa ngày khớp
        const dateSelect = document.getElementById("input-date");
        let cleanDate = row.Ngay.replace(/'/g, "");
        for (let i = 0; i < dateSelect.options.length; i++) {
          let val = JSON.parse(dateSelect.options[i].value);
          if (val.date === cleanDate) {
            dateSelect.selectedIndex = i;
            break;
          }
        }

        document.getElementById("input-session").value = row.Buoi;
        document.getElementById("input-time").value = row.Gio;
        document.getElementById("input-host").value = row.DonViMoi;
        document.getElementById("input-content").value = row.NoiDung;
        document.getElementById("input-location").value = row.DiaDiem;
        document.getElementById("input-participants").value = row.ThanhPhan;
        document.getElementById("input-leader").value = row.LanhDao;

        // Đổi trạng thái nút
        const btnSave = document.getElementById("btn-save");
        btnSave.textContent = "CẬP NHẬT";
        btnSave.classList.add("editing");
        document.getElementById("btn-cancel").style.display = "block";
      };

      // 5. CHỨC NĂNG XÓA
      window.deleteRow = function (rowIndex) {
        if (!confirm("Bạn có chắc chắn muốn xóa lịch này không?")) return;

        showLoading(true);
        const dataToSend = {
          action: "delete",
          rowIndex: rowIndex,
        };

        sendData(dataToSend);
      };

      // 6. Xử lý Submit Form (Thêm hoặc Sửa)
      document
        .getElementById("schedule-form")
        .addEventListener("submit", (e) => {
          e.preventDefault();

          const action = document.getElementById("input-action").value;
          const rowIndex = document.getElementById("input-rowIndex").value;
          const dateObj = JSON.parse(
            document.getElementById("input-date").value
          );

          const dataToSend = {
            action: action, // 'add' hoặc 'edit'
            rowIndex: rowIndex, // Chỉ dùng nếu edit

            Nam: document.getElementById("select-year").value,
            Tuan: document.getElementById("select-week").value,
            Ngay: dateObj.date,
            Thu: dateObj.thu,
            Buoi: document.getElementById("input-session").value,
            Gio: document.getElementById("input-time").value,
            DonViMoi: document.getElementById("input-host").value,
            NoiDung: document.getElementById("input-content").value,
            DiaDiem: document.getElementById("input-location").value,
            ThanhPhan: document.getElementById("input-participants").value,
            LanhDao: document.getElementById("input-leader").value,
          };

          showLoading(true);
          sendData(dataToSend);
        });

      // Hàm gửi dữ liệu đi
      function sendData(data) {
        fetch(SCRIPT_URL, {
          method: "POST",
          mode: "no-cors",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(data),
        })
          .then(() => {
            // Vì no-cors không trả về response body, ta giả định thành công
            // Tải lại dữ liệu mới nhất
            fetchData();
            resetForm();
            // showLoading(false) sẽ được gọi trong fetchData
          })
          .catch((err) => {
            alert("Lỗi: " + err);
            showLoading(false);
          });
      }

      // Reset Form về trạng thái thêm mới
      window.resetForm = function () {
        document.getElementById("schedule-form").reset();
        document.getElementById("input-action").value = "add";
        document.getElementById("input-rowIndex").value = "";

        const btnSave = document.getElementById("btn-save");
        btnSave.textContent = "THÊM MỚI";
        btnSave.classList.remove("editing");
        document.getElementById("btn-cancel").style.display = "none";

        // Set lại giá trị mặc định cho dropdown ngày (để tránh lỗi reset trắng)
        updateDateRange();
      };

      // Hiệu ứng Loading
      function showLoading(show) {
        document.getElementById("loadingOverlay").style.display = show
          ? "flex"
          : "none";
      }

      // --- CÁC HÀM TIỆN ÍCH NGÀY THÁNG (GIỮ NGUYÊN) ---
      function getDateOfWeek(w, y) {
        var simple = new Date(y, 0, 1 + (w - 1) * 7);
        var dow = simple.getDay();
        var ISOweekStart = simple;
        if (dow <= 4)
          ISOweekStart.setDate(simple.getDate() - simple.getDay() + 1);
        else ISOweekStart.setDate(simple.getDate() + 8 - simple.getDay());
        return ISOweekStart;
      }
      function formatDate(date) {
        var d = date.getDate().toString().padStart(2, "0");
        var m = (date.getMonth() + 1).toString().padStart(2, "0");
        var y = date.getFullYear();
        return `${d}/${m}/${y}`;
      }
      function getWeekNumber(d) {
        d = new Date(Date.UTC(d.getFullYear(), d.getMonth(), d.getDate()));
        d.setUTCDate(d.getUTCDate() + 4 - (d.getUTCDay() || 7));
        var yearStart = new Date(Date.UTC(d.getUTCFullYear(), 0, 1));
        return Math.ceil(((d - yearStart) / 86400000 + 1) / 7);
      }
      function updateDateRange() {
        const y = parseInt(document.getElementById("select-year").value);
        const w = parseInt(document.getElementById("select-week").value);
        const startDate = getDateOfWeek(w, y);
        const dateSelect = document.getElementById("input-date");

        // Lưu lại giá trị đang chọn (nếu có) để giữ lại sau khi reset
        const currentVal = dateSelect.value;

        dateSelect.innerHTML = "";
        let startStr = "",
          endStr = "";
        const daysOfWeek = [
          "Thứ Hai",
          "Thứ Ba",
          "Thứ Tư",
          "Thứ Năm",
          "Thứ Sáu",
          "Thứ Bảy",
          "Chủ Nhật",
        ];

        for (let i = 0; i < 7; i++) {
          const currentDay = new Date(startDate);
          currentDay.setDate(startDate.getDate() + i);
          const dateStr = formatDate(currentDay);
          const thuStr = daysOfWeek[i];
          const opt = document.createElement("option");
          opt.value = JSON.stringify({ date: dateStr, thu: thuStr });
          opt.textContent = `${thuStr} - ${dateStr}`;
          dateSelect.appendChild(opt);
          if (i === 0) startStr = dateStr;
          if (i === 6) endStr = dateStr;
        }
        document.getElementById(
          "week-range"
        ).textContent = `(Từ ngày ${startStr} đến ngày ${endStr})`;
      }
    </script>
  </body>
</html>
