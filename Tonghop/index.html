<!DOCTYPE html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Hệ thống Báo cáo Tổng hợp</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body class="dashboard-body">
    <div class="container-fluid p-4">
      <h1 class="text-center main-title mb-4">HỆ THỐNG BÁO CÁO TỔNG HỢP</h1>

      <div class="row g-4">
        <main class="col-lg-8">
          <div class="dashboard-panel">
            <h2 class="panel-title">Dashboard Tổng quan</h2>
            <div class="chart-container">
              <canvas id="topUnitsChart"></canvas>
            </div>
          </div>
        </main>

        <aside class="col-lg-4">
          <div class="sidebar">
            <a href="nhaplieu.html" class="card-link">
              <div class="card function-card mb-4">
                <div class="card-body">
                  <h3 class="card-title">Nhập Báo cáo</h3>
                  <p class="card-text">
                    Nhập số liệu báo cáo hàng ngày của các đơn vị.
                  </p>
                </div>
              </div>
            </a>
            <a href="display.html" class="card-link">
              <div class="card function-card mb-4">
                <div class="card-body">
                  <h3 class="card-title">Xem Dữ liệu Tổng hợp</h3>
                  <p class="card-text">
                    Xem, lọc và tổng hợp dữ liệu đã báo cáo.
                  </p>
                </div>
              </div>
            </a>
            <div class="card function-card disabled mb-4">
              <div class="card-body">
                <h3 class="card-title">Quản lý Đơn vị</h3>
                <p class="card-text">(Chức năng sẽ được phát triển sau)</p>
              </div>
            </div>
          </div>
        </aside>
      </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="index.js"></script>
  </body>
</html>
