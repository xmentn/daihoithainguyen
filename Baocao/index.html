<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Hệ thống Nhập và Tổng hợp số liệu báo cáo</title>
    <link rel="stylesheet" href="style.css" />
    <link
      href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <header class="main-header">
      <div class="header-container">
        <div class="brand-section">
          <div class="emblem-placeholder"></div>
          <div class="title-group">
            <h1>HỆ THỐNG THÔNG TIN BÁO CÁO VÀ TỔNG HỢP SỐ LIỆU</h1>
            <p class="subtitle">KHỐI CƠ QUAN ĐẢNG TỈNH THÁI NGUYÊN</p>
          </div>
        </div>
      </div>
    </header>

    <main class="content-container">
      <div class="announcement-card">
        <div class="icon-warning">
          <svg viewBox="0 0 24 24" width="48" height="48" fill="#D32F2F">
            <path
              d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm1 15h-2v-2h2v2zm0-4h-2V7h2v6z"
            />
          </svg>
        </div>
        <h2 class="status-title">THÔNG BÁO HỆ THỐNG</h2>
        <p class="notice-text">
          Website đang được xây dựng, vui lòng truy cập và nhập dữ liệu từ
          09h00, ngày 30/5/2026!
        </p>
      </div>
    </main>

    <footer class="main-footer">
      <p>© 2026 Phòng Chuyển đổi số - Cơ yếu, Văn phòng Tỉnh ủy Thái Nguyên.</p>
    </footer>
  </body>
</html>
