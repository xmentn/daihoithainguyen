<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quản lý Đại biểu 2025</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
</head>
<body>
    <div class="container">
        <h2 class="title">
    THÔNG TIN ĐẠI BIỂU DỰ HỘI NGHỊ <br>
    TỔNG KẾT THỰC HIỆN NGHỊ QUYẾT 57-NQ/TW NĂM 2025
</h2>
        <div class="card">
            <div class="card-header">Thông tin nhập liệu</div>
            <div class="card-body">
                <form id="dataForm">
                    <div class="row">
                        <div class="col">
                            <label>Đơn vị <span class="required">*</span></label>
                            <select id="donVi" disabled required>
                                <option value="">-- Đang tải... --</option>
                            </select>
                        </div>
                        <div class="col">
                            <label>Số lượng đại biểu <span class="required">*</span></label>
                            <input type="number" id="soLuong" disabled required placeholder="Nhập số lượng...">
                        </div>
                    </div>
                    
                    <div class="action-buttons">
                        <button type="button" id="btnAddNew" class="btn btn-primary">
                            <i class="fa fa-plus"></i> Thêm mới
                        </button>
                        
                        <button type="submit" id="btnSave" class="btn btn-save" disabled>
                            <i class="fa fa-save"></i> Lưu thông tin
                        </button>

                         <button type="button" id="btnCancel" class="btn btn-secondary" style="display:none;">
                            <i class="fa fa-times"></i> Hủy
                        </button>
                    </div>
                </form>
            </div>
        </div>

        <div class="search-bar">
             <input type="text" placeholder="Tìm kiếm nhanh..." id="searchBox">
        </div>

        <table>
            <thead>
                <tr>
                    <th style="width: 50px;">STT</th>
                    <th>Đơn vị</th>
                    <th>Số lượng</th>
                    <th style="width: 140px;">Hành động</th>
                </tr>
            </thead>
            <tbody id="dataTable">
                </tbody>
            <tfoot>
                <tr>
                    <td colspan="2" style="text-align: right; font-weight: bold;">Tổng cộng:</td>
                    <td id="totalValue" style="font-weight: bold; color: #d32f2f;">0</td>
                    <td></td>
                </tr>
            </tfoot>
        </table>
    </div>

    <script src="script.js"></script>
</body>
</html>
