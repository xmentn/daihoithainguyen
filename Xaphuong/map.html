<!DOCTYPE html>
<html lang="vi">
  <head>
    <link rel="icon" type="image/png" href="/images/Codang.png" />
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Bản đồ tỉnh Thái Nguyên</title>

    <link
      rel="stylesheet"
      href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
    />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

    <script src="data_thainguyen.js"></script>

    <style>
      body,
      html {
        margin: 0;
        padding: 0;
        height: 100%;
      }
      #map {
        width: 100%;
        height: 100vh;
      } /* Bản đồ full màn hình */

      /* Nút quay lại trang chủ */
      .back-btn {
        position: absolute;
        top: 20px;
        left: 20px;
        z-index: 1000; /* Nổi lên trên bản đồ */
        background: white;
        padding: 10px 15px;
        border-radius: 5px;
        text-decoration: none;
        color: #333;
        font-weight: bold;
        box-shadow: 0 2px 5px rgba(0, 0, 0, 0.3);
        font-family: sans-serif;
      }
      .back-btn:hover {
        background: #f0f0f0;
      }

      /* Style cho bảng tên khi di chuột (Tooltip) */
      .info-tooltip {
        background: white;
        border: 1px solid #333;
        padding: 5px;
        font-weight: bold;
      }
      .leaflet-tooltip.custom-tooltip {
        background-color: white;
        border: 1px solid #1a73e8; /* Viền xanh */
        border-radius: 6px;
        box-shadow: 0 3px 6px rgba(0, 0, 0, 0.2); /* Đổ bóng */
        padding: 8px;
      }

      /* Mũi tên nhỏ bên dưới tooltip */
      .leaflet-tooltip-top:before {
        border-top-color: #1a73e8;
      }
    </style>
  </head>
  <body>
    <a href="index.html" class="back-btn">⬅ Quay lại Danh sách</a>

    <div id="map"></div>

    <script>
      // 1. Khởi tạo bản đồ (Tọa độ trung tâm Thái Nguyên: 21.5942, 105.8482)
      var map = L.map("map").setView([21.5942, 105.8482], 10);

      // 2. Thêm lớp nền bản đồ (OpenStreetMap - Miễn phí)
      L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", {
        attribution: "&copy; OpenStreetMap contributors",
      }).addTo(map);

      // 3. Hàm tô màu ngẫu nhiên cho đẹp
      function getColor(d) {
        return d > 1000 ? "#800026" : "#BD0026"; // Bạn có thể tùy chỉnh logic màu
      }

      // 4. Style cho các xã/phường
      function style(feature) {
        return {
          fillColor: "#3388ff", // Màu nền xanh
          weight: 1, // Độ dày viền
          opacity: 1,
          color: "white", // Màu viền trắng
          dashArray: "3",
          fillOpacity: 0.5, // Độ trong suốt
        };
      }

      // 5. Hiệu ứng tương tác
      function highlightFeature(e) {
        var layer = e.target;
        layer.setStyle({
          weight: 3,
          color: "#666",
          dashArray: "",
          fillOpacity: 0.7,
        });
        layer.bringToFront();
      }

      function resetHighlight(e) {
        geojson.resetStyle(e.target);
      }

      // Hàm xử lý cho từng xã/phường
      function onEachFeature(feature, layer) {
        // 1. Lấy thông tin từ properties của file GeoJSON
        // Dùng cú pháp || "..." để phòng trường hợp dữ liệu bị thiếu
        var tenXa = feature.properties.ten_xa || "Chưa cập nhật";
        var dienTich = feature.properties.dtich_km2 || 0;
        var danSo = feature.properties.dan_so || 0;

        // 2. Format số cho đẹp (ví dụ: 11773 -> 11.773)
        // Dùng toLocaleString('vi-VN') để định dạng theo kiểu Việt Nam
        var dienTichHienThi = dienTich.toLocaleString("vi-VN");
        var danSoHienThi = danSo.toLocaleString("vi-VN");

        // 3. Tạo nội dung hiển thị (HTML)
        var noidung = `
                <div style="text-align: center; min-width: 120px">
                    <h3 style="margin: 0 0 5px; color: #d63031; font-size: 16px;">${tenXa}</h3>
                    <div style="font-size: 13px; color: #333; text-align: left;">
                        <b>📐 Diện tích:</b> ${dienTichHienThi} km²<br>
                        <b>👥 Dân số:</b> ${danSoHienThi} người
                    </div>
                </div>
            `;

        // 4. Gắn Tooltip (Hiện khi di chuột)
        layer.bindTooltip(noidung, {
          permanent: false, // false = chỉ hiện khi di chuột, true = luôn luôn hiện
          direction: "top", // Hiện phía trên con trỏ chuột
          className: "custom-tooltip", // Class để chỉnh CSS nếu cần
          opacity: 0.9,
        });

        // 5. Gán sự kiện đổi màu khi di chuột (Giữ nguyên hiệu ứng cũ)
        layer.on({
          mouseover: highlightFeature,
          mouseout: resetHighlight,
          // Nếu muốn click vào để zoom tới xã đó thì mở dòng dưới ra
          // click: function(e) { map.fitBounds(e.target.getBounds()); }
        });
      }

      // 6. Đọc dữ liệu từ biến thaiNguyenGeoJSON (đã khai báo ở bước 1)
      var geojson = L.geoJSON(thaiNguyenGeoJSON, {
        style: style,
        onEachFeature: onEachFeature,
      }).addTo(map);

      // Tự động zoom vừa khít với ranh giới Thái Nguyên
      map.fitBounds(geojson.getBounds());
    </script>
  </body>
</html>
