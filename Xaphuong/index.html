<!DOCTYPE html>
<html lang="vi">
  <head>
    <link rel="icon" type="image/png" href="/images/Codang.png" />
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Thông tin cán bộ Văn phòng</title>
    <link rel="stylesheet" href="style.css" />
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="https://cdn.sheetjs.com/xlsx-latest/package/dist/xlsx.full.min.js"></script>
  </head>
  <body>
    <div class="container">
      <h2 class="main-title">
        HỆ THỐNG THÔNG TIN CÁN BỘ VĂN PHÒNG CẤP ỦY TỈNH THÁI NGUYÊN
      </h2>

      <div class="card">
        <div class="card-header">
          <span class="header-title">Thông tin cán bộ</span>

          <a href="map.html" target="_blank" class="btn-header-map">
            🗺️ Bản đồ xã/phường
          </a>
        </div>

        <div class="card-body">
          <form id="cadresForm">
            <input type="hidden" id="rowIndex" value="" />

            <div class="form-row">
              <div class="form-group">
                <label>Họ và tên <span class="required">*</span></label>
                <input
                  type="text"
                  id="hoTen"
                  required
                  placeholder="Nhập họ tên..."
                  disabled
                />
              </div>
              <div class="form-group">
                <label
                  >Số điện thoại (zalo) <span class="required">*</span></label
                >
                <input
                  type="text"
                  id="sdt"
                  required
                  placeholder="Nhập SĐT..."
                  disabled
                />
              </div>
              <div class="form-group">
                <label>Thư điện tử (Email)</label>
                <input
                  type="email"
                  id="email"
                  placeholder="Nhập địa chỉ email..."
                  disabled
                />
              </div>
            </div>

            <div class="form-row">
              <div class="form-group">
                <label>Đơn vị <span class="required">*</span></label>
                <select id="donVi" required disabled>
                  <option value="">Đang tải...</option>
                </select>
              </div>
              <div class="form-group">
                <label>Chức vụ <span class="required">*</span></label>
                <select id="chucVu" required disabled>
                  <option value="">Đang tải...</option>
                </select>
              </div>
            </div>

            <div class="btn-group-right">
              <span id="statusMessage"></span>

              <button
                type="button"
                id="btnAdd"
                class="btn-primary"
                onclick="startAddNew()"
              >
                ➕ Thêm mới
              </button>

              <button
                type="button"
                id="btnCancel"
                onclick="cancelAction()"
                style="display: none"
              >
                Hủy
              </button>

              <button type="submit" id="btnSubmit" disabled>
                💾 Lưu thông tin
              </button>
            </div>
          </form>
        </div>
      </div>
      <div class="filter-section">
        <div class="search-box">
          <input
            type="text"
            id="searchInput"
            placeholder="🔍 Tìm theo tên, đơn vị hoặc email..."
          />
        </div>
        <div class="filter-box">
          <select id="filterChucVu">
            <option value="">-- Tất cả chức vụ --</option>
          </select>
        </div>
        <button type="button" id="btnExport" onclick="exportExcel()">
          📥 Xuất Excel
        </button>
      </div>

      <div class="table-container">
        <p id="loadingText" class="loading">Đang tải dữ liệu...</p>
        <table>
          <thead>
            <tr>
              <th style="width: 35px; text-align: center">STT</th>
              <th style="min-width: 140px">Họ tên</th>
              <th style="min-width: 180px">Đơn vị</th>
              <th style="min-width: 180px">Chức vụ</th>
              <th style="width: 100px">SĐT</th>
              <th>Email</th>
              <th style="width: 100px; text-align: center">Hành động</th>
            </tr>
          </thead>
          <tbody id="tableBody"></tbody>
        </table>
        <div
          id="noResult"
          style="display: none; text-align: center; padding: 20px; color: #888"
        >
          Không tìm thấy kết quả nào.
        </div>
      </div>
    </div>

    <script src="script.js"></script>
  </body>
</html>
